<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipul'Monnaie - ULIS</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
		/* Bouton de changement de jeu */
        .btn-change-game {
            display: inline-block;
            text-decoration: none;
            background-color: #9b59b6; /* Un violet pédagogique */
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
        }
        
        .btn-change-game:hover {
            background-color: #8e44ad;
        }
        
        .btn-change-game:active {
            transform: scale(0.95);
        }
        
        .btn-change-game i {
            margin-right: 8px;
        }
		
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background: var(--primary);
            color: white;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .controls {
            margin: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        .btn-lvl { background: #ddd; }
        .active { background: var(--accent); color: white; font-weight: bold; }

        #game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
        }

        /* Zone Cible */
        .target-zone {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            flex: 1;
            min-width: 300px;
        }

        .target-image {
            max-width: 150px;
            height: auto;
            border-radius: 10px;
        }

        .price-tag {
            font-size: 3rem;
            color: #e74c3c;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Portefeuille (Zone de clic) */
        .wallet {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
        }

        .money-item {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .money-item:hover { transform: scale(1.05); }

        .money-item img {
            height: 80px; /* Taille billets */
            width: auto;
            border-radius: 4px;
        }

        .piece img { height: 60px; } /* Taille pièces */

        /* Zone de dépôt (Ma main) */
        .hand {
            width: 100%;
            min-height: 120px;
            background: #fff;
            border: 3px dashed #bdc3c7;
            border-radius: 15px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            align-items: center;
        }

        .hand img { height: 50px; }

        /* Aide et Validation */
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .btn-check { background: #27ae60; color: white; font-size: 1.5rem; }
        .btn-help { background: #f1c40f; color: #333; }
        .btn-reset { background: #e74c3c; color: white; }

        #help-display {
            margin-top: 10px;
            font-weight: bold;
            color: var(--primary);
            min-height: 24px;
        }

        #success-msg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 100;
        }

        #success-msg h2 { font-size: 4rem; color: var(--accent); margin: 0; }
    </style>
</head>
<body>

	<header>
		<h1>Manipul'Monnaie</h1>
	</header>
	
	<a href="index.html" class="btn btn-change-game">
        <i class="fas fa-exchange-alt"></i> Changer de jeu
    </a>    

	<div class="controls">
		<button class="btn-lvl active" onclick="setLevel(1)">Niveau 1 (1-10€)</button>
		<button class="btn-lvl" onclick="setLevel(2)">Niveau 2 (10-100€)</button>
		<button class="btn-lvl" onclick="setLevel(3)">Niveau 3 (Centimes)</button>
	</div>

	<div id="game-container">
		<div class="target-zone">
			<img src="images/portemonnaie.jpg" alt="Porte-monnaie" class="target-image">
			<div id="target-price" class="price-tag">0 €</div>
			<p>Mets le compte juste sur la table !</p>
		</div>

		<div class="wallet" id="wallet">
			</div>

		<div class="hand" id="player-hand">
			</div>

		<div id="help-display"></div>

		<div class="actions">
			<button class="btn-help" onclick="showHelp()">💡 Aide</button>
			<button class="btn-reset" onclick="resetHand()">🗑️ Vider</button>
			<button class="btn-check" onclick="checkResult()">✅ Valider</button>
		</div>
	</div>

	<div id="success-msg">
		<h2>BRAVO ! 🏆</h2>
		<button onclick="nextQuestion()" style="margin-top:20px">Question suivante</button>
	</div>

	<script>
		let currentLevel = 1;
		let targetAmount = 0;
		let currentAmount = 0;
		let countItems = 0;

		const moneyData = [
			{ name: '50e', val: 50, type: 'billet' },
			{ name: '20e', val: 20, type: 'billet' },
			{ name: '10e', val: 10, type: 'billet' },
			{ name: '5e', val: 5, type: 'billet' },
			{ name: '2e', val: 2, type: 'piece' },
			{ name: '1e', val: 1, type: 'piece' },
			{ name: '50c', val: 0.5, type: 'piece' },
			{ name: '20c', val: 0.2, type: 'piece' },
			{ name: '10c', val: 0.1, type: 'piece' },
			{ name: '5c', val: 0.05, type: 'piece' },
			{ name: '2c', val: 0.02, type: 'piece' },
			{ name: '1c', val: 0.01, type: 'piece' }
		];

		function setLevel(lvl) {
			currentLevel = lvl;
			document.querySelectorAll('.btn-lvl').forEach((b, i) => {
				b.classList.toggle('active', i + 1 === lvl);
			});
			nextQuestion();
		}

		function initWallet() {
			const walletDiv = document.getElementById('wallet');
			walletDiv.innerHTML = '';
			
			let filtered = [];
			if (currentLevel === 1) filtered = moneyData.filter(m => m.val <= 5 && m.val >= 1);
			else if (currentLevel === 2) filtered = moneyData.filter(m => m.val >= 1);
			else filtered = moneyData;

			filtered.forEach(item => {
				const div = document.createElement('div');
				div.className = `money-item ${item.type}`;
				div.innerHTML = `<img src="images/${item.name}.jpg" alt="${item.val}">`;
				div.onclick = () => addToHand(item);
				walletDiv.appendChild(div);
			});
		}

		function nextQuestion() {
			document.getElementById('success-msg').style.display = 'none';
			document.getElementById('help-display').innerText = '';
			resetHand();
			
			if (currentLevel === 1) {
				targetAmount = Math.floor(Math.random() * 9) + 1;
			} else if (currentLevel === 2) {
				targetAmount = Math.floor(Math.random() * 90) + 10;
			} else {
				targetAmount = (Math.random() * 20 + 0.1).toFixed(2);
			}
			
			document.getElementById('target-price').innerText = `${targetAmount} €`;
			initWallet();
		}

		function addToHand(item) {
			currentAmount = parseFloat((currentAmount + item.val).toFixed(2));
			countItems++;
			const hand = document.getElementById('player-hand');
			const img = document.createElement('img');
			img.src = `images/${item.name}.jpg`;
			hand.appendChild(img);
		}

		function resetHand() {
			currentAmount = 0;
			countItems = 0;
			document.getElementById('player-hand').innerHTML = '';
			document.getElementById('help-display').innerText = '';
		}

		function showHelp() {
			document.getElementById('help-display').innerText = 
				`Tu as mis ${countItems} objet(s) pour une valeur de ${currentAmount} €`;
		}

		function checkResult() {
			if (currentAmount == targetAmount) {
				document.getElementById('success-msg').style.display = 'block';
				confetti({
					particleCount: 150,
					spread: 70,
					origin: { y: 0.6 }
				});
			} else {
				alert(currentAmount > targetAmount ? "C'est trop !" : "Il en manque encore...");
			}
		}

		// Lancement au démarrage
		nextQuestion();
	</script>

</body>
</html>
